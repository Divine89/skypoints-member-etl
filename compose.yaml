services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DATABASE:-postgres}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skypoints-postgres:
