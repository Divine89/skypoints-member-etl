services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DATABASE:-skypoints}
      POSTGRES_USER: ${PG_USER:-skypoints}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - skypoints-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-skypoints} -d ${PG_DATABASE:-skypoints}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skypoints-postgres:
